<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="v-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#090D16" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#00D2FF" stroke-opacity="0.25" />
  
  <!-- Network vertex lines -->
  <path d="M16 18L32 48L48 18" stroke="url(#v-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M24 33H40" stroke="#00D2FF" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="3 3" />
  <path d="M32 16V33" stroke="#00D2FF" stroke-opacity="0.5" stroke-width="2" />
  
  <!-- Glowing vertex nodes -->
  <circle cx="16" cy="18" r="4" fill="#00D2FF" filter="url(#glow)" />
  <circle cx="48" cy="18" r="4" fill="#00D2FF" filter="url(#glow)" />
  <circle cx="32" cy="48" r="4.5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="32" cy="24" r="2.5" fill="#FFFFFF" />
</svg>